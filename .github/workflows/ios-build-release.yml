name: iOS Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-and-release:
    name: Build iOS App and Create Release
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
            PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
            KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH"

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles

            echo "SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "No signing credentials found — building unsigned IPA for sideloading."
            echo "SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Build archive
        run: |
          if [ "$SIGNING_AVAILABLE" = "true" ]; then
            xcodebuild archive \
              -project V2RayClient/V2RayClient.xcodeproj \
              -scheme V2RayClient \
              -sdk iphoneos \
              -configuration Release \
              -archivePath "$RUNNER_TEMP/V2RayClient.xcarchive" \
              SKIP_INSTALL=NO \
              BUILD_LIBRARY_FOR_DISTRIBUTION=YES
          else
            xcodebuild archive \
              -project V2RayClient/V2RayClient.xcodeproj \
              -scheme V2RayClient \
              -sdk iphoneos \
              -configuration Release \
              -archivePath "$RUNNER_TEMP/V2RayClient.xcarchive" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              SKIP_INSTALL=NO \
              BUILD_LIBRARY_FOR_DISTRIBUTION=YES
          fi

      - name: Export signed IPA
        if: env.SIGNING_AVAILABLE == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/V2RayClient.xcarchive" \
            -exportOptionsPlist V2RayClient/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/ipa"

      - name: Package unsigned IPA for sideloading
        if: env.SIGNING_AVAILABLE == 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          APP_PATH=$(find "$RUNNER_TEMP/V2RayClient.xcarchive/Products/Applications" -name "*.app" -maxdepth 1 -type d | head -1)
          cp -r "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -r V2RayClient.ipa Payload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: V2RayClient ${{ steps.version.outputs.version }}
          body: |
            ## V2RayClient ${{ steps.version.outputs.version }}

            ### How to install on your iPhone

            **Option 1 — AltStore (Recommended, free)**
            1. Install [AltStore](https://altstore.io/) on your iPhone
            2. Download `V2RayClient.ipa` from this release
            3. In AltStore tap the **+** button and select the downloaded IPA

            **Option 2 — Sideloadly (Mac / Windows)**
            1. Install [Sideloadly](https://sideloadly.io/) on your computer
            2. Connect your iPhone via USB
            3. Download `V2RayClient.ipa` and drag it into Sideloadly

            **Option 3 — 3uTools (Windows)**
            1. Install [3uTools](http://www.3u.com/)
            2. Download `V2RayClient.ipa` and install via the Apps tab

            > **After installation:** go to **Settings → General → VPN & Device Management** and trust the developer certificate.
            >
            > **Note:** VPN / NetworkExtension features require re-signing with a paid Apple Developer certificate that includes the NetworkExtension entitlement.
          draft: false
          prerelease: false
          generate_release_notes: false
          files: ${{ runner.temp }}/ipa/V2RayClient.ipa
